name: Publish Cannon runtime images

on:
  push:
    branches:
      - dev
    paths:
      - '.github/dependabot.yml'
      - '.github/scripts/generate-bundle-input-sbom.mjs'
      - '.github/scripts/generate-expected-runtime-sbom.sh'
      - '.github/scripts/scan-runtime-image.sh'
      - '.github/scripts/verify-runtime-bundle-input.mjs'
      - '.github/scripts/verify-runtime-image.sh'
      - '.github/workflows/runtime-image-security.yml'
      - '.github/workflows/runtime-publish.yml'
      - 'docker/api.Dockerfile'
      - 'docker/indexer.Dockerfile'
      - 'docker/repo.Dockerfile'
      - 'package.json'
      - 'packages/api/**'
      - 'packages/artifact-codec/**'
      - 'packages/builder/**'
      - 'packages/cli/**'
      - 'packages/indexer/**'
      - 'packages/repo/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  validate-runtime:
    if: >-
      vars.CANNON_RUNTIME_PUBLISH_ENABLED == 'true' &&
      github.repository == 'Reya-Labs/cannon' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      github.ref_protected
    permissions:
      attestations: read
      contents: read
      packages: read
    uses: ./.github/workflows/runtime-image-security.yml

  publish-runtime:
    needs: validate-runtime
    if: >-
      needs.validate-runtime.result == 'success' &&
      vars.CANNON_RUNTIME_PUBLISH_ENABLED == 'true' &&
      github.repository == 'Reya-Labs/cannon' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      github.ref_protected
    environment: cannon-image-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: cannon-runtime-publish-${{ matrix.runtime }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: repo
            dockerfile: ./docker/repo.Dockerfile
            package_json: packages/repo/package.json
            image_name: ghcr.io/reya-labs/repo
            command: '["node","index.js"]'
          - runtime: indexer
            dockerfile: ./docker/indexer.Dockerfile
            package_json: packages/indexer/package.json
            image_name: ghcr.io/reya-labs/indexer
            command: '["node","dist/registry/index.js"]'
          - runtime: api
            dockerfile: ./docker/api.Dockerfile
            package_json: packages/api/package.json
            image_name: ghcr.io/reya-labs/api
            command: '["node","index.js"]'
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive source-addressed image metadata
        id: metadata
        env:
          PACKAGE_JSON: ${{ matrix.package_json }}
        run: |
          version="$(jq -er '.version' "$PACKAGE_JSON")"
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_REVISION")"
          created="$(date -u --date="@${source_date_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          test "$version" != "unknown"
          test -n "$source_date_epoch"
          test -n "$created"
          {
            echo "version=$version"
            echo "source_date_epoch=$source_date_epoch"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish the source-addressed image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SOURCE_REVISION }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            BUILD_REVISION=${{ env.SOURCE_REVISION }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
          provenance: mode=max
          sbom: true

      - name: Verify the published manifest
        env:
          EXPECTED_COMMAND: ${{ matrix.command }}
          EXPECTED_CREATED: ${{ steps.metadata.outputs.created }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.version }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RUNTIME_KIND: ${{ matrix.runtime }}
        run: |
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull --platform linux/amd64 "$image_ref"
          .github/scripts/verify-runtime-image.sh \
            "$image_ref" \
            "$RUNTIME_KIND" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "$SOURCE_REVISION" \
            "$EXPECTED_VERSION" \
            "$EXPECTED_COMMAND" \
            "$EXPECTED_CREATED"

      - name: Attest the published manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ steps.metadata.outputs.version }}
          push-to-registry: true
          create-storage-record: true

      - name: Create immutable publication record
        id: publication
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RUNTIME_KIND: ${{ matrix.runtime }}
          VERSION: ${{ steps.metadata.outputs.version }}
          CREATED: ${{ steps.metadata.outputs.created }}
        run: |
          case "$RUNTIME_KIND" in
            repo|indexer|api) ;;
            *) exit 1 ;;
          esac
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          if ! [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          if ! [[ "$CREATED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            exit 1
          fi
          if ! [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            exit 1
          fi
          if ! [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            exit 1
          fi
          test "$IMAGE_NAME" = "ghcr.io/reya-labs/${RUNTIME_KIND}"
          test -n "$VERSION"

          umask 077
          record_directory="${RUNNER_TEMP}/cannon-runtime-publication-${RUNTIME_KIND}"
          test ! -e "$record_directory"
          install -d -m 0700 "$record_directory"
          record_path="${record_directory}/publication.json"
          record_temp="$(mktemp "${record_path}.XXXXXX")"
          cleanup_record() {
            rm -f "$record_temp"
          }
          trap cleanup_record EXIT

          jq \
            --null-input \
            --sort-keys \
            --arg runtime "$RUNTIME_KIND" \
            --arg image_ref "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg version "$VERSION" \
            --arg created "$CREATED" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schemaVersion: 1,
              runtime: $runtime,
              imageRef: $image_ref,
              imageDigest: $image_digest,
              sourceRevision: $source_revision,
              version: $version,
              created: $created,
              platform: "linux/amd64",
              publisher: {
                repository: $repository,
                workflow: "Reya-Labs/cannon/.github/workflows/runtime-publish.yml",
                workflowRevision: $source_revision,
                runId: $run_id,
                runAttempt: $run_attempt,
                runUrl: $run_url
              }
            }' > "$record_temp"

          jq --exit-status \
            --arg runtime "$RUNTIME_KIND" \
            --arg image_ref "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --arg source_revision "$SOURCE_REVISION" \
            '
              .schemaVersion == 1 and
              .runtime == $runtime and
              .imageRef == $image_ref and
              .sourceRevision == $source_revision and
              .platform == "linux/amd64" and
              (.publisher.repository == "Reya-Labs/cannon") and
              (.publisher.workflow ==
                "Reya-Labs/cannon/.github/workflows/runtime-publish.yml") and
              (.publisher.workflowRevision == $source_revision)
            ' "$record_temp" > /dev/null

          mv "$record_temp" "$record_path"
          trap - EXIT
          sha256sum "$record_path"
          {
            echo "record_directory=$record_directory"
            echo "record_path=$record_path"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable publication record
        id: publication_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: runtime-publication-${{ matrix.runtime }}-${{ env.SOURCE_REVISION }}-attempt-${{ github.run_attempt }}
          overwrite: false
          path: ${{ steps.publication.outputs.record_directory }}
          retention-days: 90

      - name: Record the immutable image reference
        env:
          ARTIFACT_DIGEST: ${{ steps.publication_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.publication_artifact.outputs.artifact-url }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RUNTIME_KIND: ${{ matrix.runtime }}
        run: |
          if ! [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          if ! [[ "$ARTIFACT_URL" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/"* ]]; then
            exit 1
          fi
          {
            echo "## ${RUNTIME_KIND} image"
            echo
            echo "\`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
            echo
            echo "Publication record: [artifact](${ARTIFACT_URL})"
            echo
            echo "Publication artifact digest: \`sha256:${ARTIFACT_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
