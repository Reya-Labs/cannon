name: Reya Safe UI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reya-safe-ui:
    name: Build and verify disabled signer shell
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: reya-safe-ui-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @reya/cannon-safe-ui...
      - name: Build the exact workspace Cannon runtime used by local QA
        run: pnpm --filter @usecannon/builder build:node
      - run: pnpm --filter @reya/cannon-safe-ui lint
      - run: pnpm --filter @reya/cannon-safe-ui test
      - name: Prove Reya read clients remain dormant and fallback-free
        run: pnpm --filter @reya/cannon-safe-ui verify:dormant
      - name: Build the disabled Reya profile
        run: pnpm --filter @reya/cannon-safe-ui build
        env:
          REYA_SAFE_UI_ACTIVATION: disabled
          REYA_SAFE_UI_BUILD_SHA: ${{ github.sha }}
          REYA_SAFE_UI_CHAIN_ID: '1729'
          REYA_SAFE_UI_PROFILE: reya-mainnet
          # Verification-only inputs for the deliberately disabled shell.
          # Activation must rebuild with the separately reviewed Reya values.
          REYA_SAFE_UI_SAFE_ADDRESS: '0x1111111111111111111111111111111111111111'
          REYA_SAFE_UI_SERVICE_ORIGIN: https://cannon-api.reya-tailnet.ts.net
      - name: Reject undeclared files and hosted runtime dependencies
        run: pnpm --filter @reya/cannon-safe-ui scan
      - name: Capture tested release metadata
        id: release
        working-directory: packages/reya-safe-ui
        run: |
          {
            echo "asset_digest=$(jq -r '.export.assetDigest' dist/release.json)"
            echo "config_digest=$(jq -r '.build.configDigest' dist/release.json)"
            echo "source_digest=$(jq -r '.build.sourceDigest' dist/release.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the exact tested export
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reya-safe-ui-${{ github.sha }}
          path: packages/reya-safe-ui/dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: false
          include-hidden-files: false
      - name: Record immutable release evidence
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ASSET_DIGEST: ${{ steps.release.outputs.asset_digest }}
          CONFIG_DIGEST: ${{ steps.release.outputs.config_digest }}
          SOURCE_DIGEST: ${{ steps.release.outputs.source_digest }}
        run: |
          {
            echo '## Disabled Reya Safe UI'
            echo
            echo "- Git revision: \`${GITHUB_SHA}\`"
            echo "- Source digest: \`${SOURCE_DIGEST}\`"
            echo "- Configuration digest: \`${CONFIG_DIGEST}\`"
            echo "- Asset digest: \`${ASSET_DIGEST}\`"
            echo "- GitHub artifact digest: \`${ARTIFACT_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  reya-local-website:
    name: Build and scan local signer profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: reya-safe-website-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @reya/cannon-safe-website... --filter @reya/cannon-safe-ui... --filter @usecannon/website...
      - name: Build the content-address codec used by the browser profile
        run: pnpm --filter @usecannon/artifact-codec build
      - run: pnpm --filter @reya/cannon-safe-website typecheck
      - run: pnpm --filter @reya/cannon-safe-website test
      - name: Build the constrained local profile
        run: pnpm --filter @reya/cannon-safe-website build
        env:
          REYA_LOCAL_PROFILE: enabled
          REYA_LOCAL_INGRESS_ORIGIN: http://127.0.0.1:8787
          REYA_LOCAL_SAFE_ADDRESS: '0x1111111111111111111111111111111111111111'
          REYA_LOCAL_SOURCE_COMMIT: 2b10669075b91eb8db781d199292f30c52f8e994
      - name: Reject hosted dependencies and execution capabilities
        run: pnpm --filter @reya/cannon-safe-website scan
      - name: Upload the exact tested local profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reya-safe-website-${{ github.sha }}
          path: packages/reya-safe-website/out
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: false
          include-hidden-files: false
      - name: Install the pinned Cypress browser runtime
        run: pnpm --filter @usecannon/website exec cypress verify || pnpm --filter @usecannon/website exec cypress install --force
      - name: Prove shared 3-of-5 signer coordination through the browser
        run: pnpm --filter @reya/cannon-safe-website e2e:shared-proposal
        env:
          REYA_E2E_REDIS_URL: redis://127.0.0.1:16379/0
      - name: Upload deterministic signer-state screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reya-safe-signer-e2e-${{ github.sha }}
          path: packages/reya-safe-website/cypress/screenshots
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
          overwrite: false
          include-hidden-files: false

  reya-production-website:
    name: Build and scan production signer profile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: reya-production-website-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @reya/cannon-safe-website... --filter @reya/cannon-safe-ui... --filter @usecannon/website...
      - name: Build the content-address codec used by the browser profile
        run: pnpm --filter @usecannon/artifact-codec build
      - run: pnpm --filter @reya/cannon-safe-website typecheck
      - run: pnpm --filter @reya/cannon-safe-website test
      - name: Build the exact production signer profile
        run: pnpm --filter @reya/cannon-safe-website build:production
        env:
          REYA_PRODUCTION_BUILD_COMMIT: ${{ github.sha }}
          REYA_PRODUCTION_INGRESS_ORIGIN: https://cannon-safe-staging.tailf2022c.ts.net
          REYA_PRODUCTION_SAFE_ADDRESS: '0x1fe50318e5e3165742edc9c4a15d997bdb935eb9'
          REYA_PRODUCTION_SITE_ORIGIN: https://cannon.reya.xyz
          REYA_PRODUCTION_SOURCE_COMMIT: 2b10669075b91eb8db781d199292f30c52f8e994
          REYA_PRODUCTION_STAGING: enabled
      - name: Reject hosted dependencies, mutable configuration and execution capability
        run: pnpm --filter @reya/cannon-safe-website scan:production
      - name: Upload the exact tested production candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reya-safe-website-production-${{ github.sha }}
          path: packages/reya-safe-website/out
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          overwrite: false
          include-hidden-files: true
