name: Website-e2e

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: reya-cannon-ci-no-walletconnect
      # Public, credential-free endpoints are transitional PR fixtures. PRO-726 replaces
      # them with Reya-controlled test infrastructure before activation.
      NEXT_PUBLIC_CANNON_E2E_RPC_URL_ETHEREUM: https://ethereum-rpc.publicnode.com
      NEXT_PUBLIC_CANNON_E2E_RPC_URL_SEPOLIA: https://ethereum-sepolia-rpc.publicnode.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: '22.23.1'

      - run: pnpm i --frozen-lockfile
      - run: pnpm build

      - name: Set up Cypress binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-cypress-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cypress install
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
        with:
          runTests: false

      - name: Cypress verify
        run: pnpm cypress verify || pnpm cypress install --force
        working-directory: packages/website

      - name: Cypress run
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
        with:
          install: false
          working-directory: packages/website
          command: pnpm -r --filter @usecannon/website run e2e:headless

      # upload screenshots as an artifact in case of a problem with the cypress build and we dont know what is happening
      - name: Upload Screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: packages/website/cypress/screenshots/
          if-no-files-found: ignore
