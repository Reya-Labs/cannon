name: Supply chain

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-policy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json
      - run: npm ci --ignore-scripts --prefix .github/scripts
      - run: node .github/scripts/audit-workflows.mjs
      - run: node .github/scripts/audit-workflows.test.mjs
      - run: node .github/scripts/generate-bundle-input-sbom.test.mjs
      - run: node .github/scripts/generate-expected-runtime-sbom.test.mjs
      - run: node .github/scripts/runtime-evidence-paths.test.mjs
      - run: node .github/scripts/runtime-publication-record.test.mjs
      - run: node .github/scripts/validate-runtime-image-inventory.test.mjs
      - run: node .github/scripts/validate-runtime-image-inventory.mjs .github/runtime-image-inventory.json
      - run: node .github/scripts/verify-runtime-bundle-input.test.mjs
      - run: node .github/scripts/verify-service-publisher-workflows.mjs
      - run: node .github/scripts/verify-service-publisher-workflows.test.mjs
      - run: bash -n .github/scripts/generate-expected-runtime-sbom.sh .github/scripts/scan-runtime-image.sh .github/scripts/verify-runtime-image.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
