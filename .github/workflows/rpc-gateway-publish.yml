name: Publish RPC gateway image

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  rpc-gateway:
    permissions:
      contents: read
    uses: ./.github/workflows/rpc-gateway.yml

  publish-rpc-gateway:
    needs: rpc-gateway
    if: >-
      needs.rpc-gateway.result == 'success' &&
      vars.CANNON_RPC_GATEWAY_PUBLISH_ENABLED == 'true' &&
      github.repository == 'Reya-Labs/cannon' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      github.ref_protected
    environment: cannon-image-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: rpc-gateway-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/reya-labs/rpc-gateway
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_name: ${{ env.IMAGE_NAME }}
      image_ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive source-addressed image metadata
        id: image-metadata
        env:
          IMAGE_REVISION: ${{ github.sha }}
        run: >-
          bash packages/rpc-gateway/scripts/image-metadata.sh
          "${IMAGE_REVISION}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish the source-addressed image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./packages/rpc-gateway
          file: ./packages/rpc-gateway/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.image-metadata.outputs.version }}
            BUILD_REVISION=${{ steps.image-metadata.outputs.revision }}
            BUILD_DATE=${{ steps.image-metadata.outputs.build_date }}
            SOURCE_DATE_EPOCH=${{ steps.image-metadata.outputs.source_date_epoch }}
          provenance: mode=max
          sbom: true
      - name: Verify the published manifest
        env:
          EXPECTED_BASE_DIGEST: sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          EXPECTED_BASE_NAME: docker.io/library/alpine:3.24.1
          EXPECTED_BUILD_DATE: ${{ steps.image-metadata.outputs.build_date }}
          EXPECTED_BUILD_REVISION: ${{ steps.image-metadata.outputs.revision }}
          EXPECTED_SOURCE: https://github.com/Reya-Labs/cannon
          EXPECTED_SOURCE_DATE_EPOCH: ${{ steps.image-metadata.outputs.source_date_epoch }}
          EXPECTED_VERSION: ${{ steps.image-metadata.outputs.version }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          bash packages/rpc-gateway/scripts/verify-image.sh "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Attest the published manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ steps.image-metadata.outputs.version }}
          push-to-registry: true
          create-storage-record: true
      - name: Record the immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '## RPC gateway image'
            echo
            echo "\`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
