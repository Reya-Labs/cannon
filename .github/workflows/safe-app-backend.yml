name: Safe-app-backend

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-app-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: safe-app-backend-ci-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: packages/safe-app-backend/pnpm-lock.yaml
      - run: pnpm --dir packages/safe-app-backend --ignore-workspace install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir packages/safe-app-backend --ignore-workspace audit --prod --audit-level high
      - run: pnpm --dir packages/safe-app-backend --ignore-workspace lint
      - run: pnpm --dir packages/safe-app-backend --ignore-workspace build
      - run: pnpm --dir packages/safe-app-backend --ignore-workspace test
        env:
          BUILD_REVISION: ${{ github.sha }}
          REDIS_URL: redis://127.0.0.1:6379
      - name: Build the release image locally
        env:
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_VERSION: ${{ github.sha }}
        run: >-
          docker build
          --build-arg "VERSION=${IMAGE_VERSION}"
          --build-arg "BUILD_REVISION=${IMAGE_REVISION}"
          --tag safe-app-backend:ci
          packages/safe-app-backend
      - name: Reject fixed high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: safe-app-backend:ci
          version: v0.72.0
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Verify runtime identity and embedded revision
        env:
          EXPECTED_BUILD_REVISION: ${{ github.sha }}
        run: bash packages/safe-app-backend/scripts/verify-image.sh safe-app-backend:ci

  publish-safe-app-backend:
    needs: safe-app-backend
    if: >-
      needs.safe-app-backend.result == 'success' &&
      github.repository == 'Reya-Labs/cannon' &&
      github.ref == 'refs/heads/dev' &&
      github.ref_protected &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: safe-app-backend-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/reya-labs/safe-app-backend
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ env.IMAGE_NAME }}
      image_ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish the source-addressed image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./packages/safe-app-backend
          file: ./packages/safe-app-backend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify the published manifest
        env:
          EXPECTED_BUILD_REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull "${IMAGE_NAME}@${IMAGE_DIGEST}"
          bash packages/safe-app-backend/scripts/verify-image.sh "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Attest the published manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          subject-version: ${{ github.sha }}
          push-to-registry: true
          create-storage-record: true
      - name: Record the immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '## Safe app backend image'
            echo
            echo "\`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
